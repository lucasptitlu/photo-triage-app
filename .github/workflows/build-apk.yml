name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Find project folder
        id: proj
        run: |
          echo "Android SDK: $ANDROID_HOME"
          echo "Files in repository:"; find . -path ./.git -prune -o -type f -print | head -50
          f=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then echo "::error::settings.gradle not found - the project files were not uploaded"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoTriage-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
