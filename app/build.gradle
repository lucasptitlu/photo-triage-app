plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lucas.phototriage'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lucas.phototriage'
        minSdk 30
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Fixed signing key, so each new APK installs as an update over the previous one.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
